name: iOS

on:
  push:
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app on macOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Ruby gems
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ hashFiles('mobile/ios/Podfile', 'mobile/package-lock.json') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: bundle exec pod install
        working-directory: mobile/ios

      - name: Build unsigned Release for iPhone
        run: |
          set -euo pipefail
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local
          mkdir -p ios/build
          xcodebuild \
            -workspace ios/vampn.xcworkspace \
            -scheme vampn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            VALIDATE_PRODUCT=NO \
            build | tee ios/build/xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="ios/build/Release/Build/Products/Release-iphoneos/vampn.app"
          test -d "$APP"
          rm -rf ios/dist
          mkdir -p ios/dist/Payload
          cp -R "$APP" ios/dist/Payload/
          (cd ios/dist && zip -qry ../vampn-release.ipa Payload)
          ls -lh ios/vampn-release.ipa "$APP"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vampn-ipa
          path: mobile/ios/vampn-release.ipa
          if-no-files-found: error

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: mobile/ios/build/xcodebuild.log
          if-no-files-found: ignore
